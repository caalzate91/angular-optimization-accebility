<div class="app-container">
  <header class="app-header">
    <div class="header-content">
      <img ngSrc="assets/o6cwlzg3exk41.png" alt="Rick and Morty Banner" class="banner-image"
           width="800" height="208" priority
           sizes="(max-width: 768px) 100vw, (max-width: 1200px) 80vw, 800px">
      <div class="language-selector-container">
        <app-language-selector></app-language-selector>
      </div>
    </div>
  </header>

  <main class="main-content">
    <app-character-list></app-character-list>
  </main>

  <footer class="app-footer">
    <div class="footer-content">
      <img ngSrc="assets/rick-and-morty-escape-facebook-cover.jpg" alt="Rick and Morty Footer" class="footer-image"
           width="400" height="148" loading="lazy"
           sizes="(max-width: 768px) 100vw, 400px">
      <div class="footer-text">
        <p i18n="@@footer.copyright">&copy; 2025 Rick and Morty Character Explorer</p>
        <p i18n="@@footer.data-source">Data provided by <a href="https://rickandmortyapi.com/" target="_blank" rel="noopener">The Rick and Morty API</a></p>
      </div>
    </div>
  </footer>
</div>
